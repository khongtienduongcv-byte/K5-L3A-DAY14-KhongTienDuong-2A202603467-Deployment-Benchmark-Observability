name: quality-gate

on:
  pull_request:
    branches: [main]

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Start agent v2 and run quality gate eval
        working-directory: 06-lab-complete/benchmark-observability/develop
        run: |
          pip install -r requirements.txt
          AGENT_VERSION=v2 MOCK_ERROR_RATE=0 PORT=8002 python app.py &
          AGENT_PID=$!
          for _ in $(seq 1 20); do
            curl -sf http://localhost:8002/health >/dev/null && break
            sleep 1
          done
          python eval/run_eval.py --url http://localhost:8002 --min-accuracy 0.85 --baseline ../../reports/eval_v2.json
          kill -TERM "$AGENT_PID" || true
